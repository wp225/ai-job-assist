on: [push]
name: ACR_Container_Workflow
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout github Action"
      uses: actions/checkout@main
    
    - name: "Login to ACR"
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: "Build and push Docker Image"
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: aijobassist.azurecr.io/ai-job-assist:latest

    - name: "Update Container Instance"
      uses: azure/cli@v1
      with:
        azcliversion: latest
        inlineScript: |
          az login -u ${{ secrets.AZURE_USERNAME }} -p ${{ secrets.AZURE_PASSWORD }} --tenant ${{ secrets.AZURE_TENANT_ID }}
          az container update --resource-group ML --name ai-job-assist-container --image aijobassist.azurecr.io/ai-job-assist:latest